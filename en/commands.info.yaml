### About commands
about_desc1: "**Your music, wherever you play. Listen with friends in voice channels, launch the Discord Activity, or enjoy music from the web player.**"
about_desc2: |
  ・Bot prefix for this server is `%{prefix}`
  ・Play a track by link or search term `%{prefix} play`
  Visit our **[website](%{website})** or use the `%{prefix} help` command for more commands.
about_desc3: |
  **Heads up!**
  I preferably require `Administrator` permissions, but...
  Even if you don't give me those permissions, I can still work, but I might not be able to do everything I'm capable of. Just saying!

  **Help and Support**
  Join our **[support server](%{serversupport})** if you need help, want to get information about updates and issues or want to engage with the community!

