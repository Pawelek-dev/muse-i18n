## Helper setup ##
setup_helper_content: |
  ## Welcome to %{guild}
   *New here? You are in the right place.*
   > **Your music, wherever you play. Listen with friends in voice channels, launch the Discord Activity, or enjoy music from the web player.**
   This server is the home of the %{guild}.
   You can chat, share songs, get support, and discover everything %{bot} offers.
  ### Quick Navigation
   - Report bugs: https://discord.com/channels/
   - Share suggestions: https://discord.com/channels/
   - Create a support ticket: https://discord.com/channels/
   - Open the Helpdesk (FAQ): https://discord.com/channels/
  ### Community Tips
   - Be respectful and keep conversations friendly.
   - Use the right channel for the right topic.
   - If you need help, include details so the team can assist faster.
   Want to invite your friends? Share this server link: %{serversupport}

