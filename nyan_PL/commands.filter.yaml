eq_icon: "https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif"
eq_desc: |
  Możesz regulować **10 pasm** w zakresie od **-10** do **10**~!
  Nie musisz podawać wszystkich, tylko te, które chcesz zmienić!
  Jeśli chcesz pominąć któreś pasmo, wpisz tam po prostu **0**~ UwU
