### About commands
about_desc1: "**Twoja muzyczka, gdziekolwiek grasz~ Słuchaj ze znajomymi na kanałach głosowych, uruchom Aktywność Discorda albo korzystaj z odtwarzacza w przeglądarce!** UwU"
about_desc2: |
  ・Prefiks bota na tym serwerku to `%{prefix}` nya~
  ・Puść utwówek, podając link albo hasło wyszukiwania: `%{prefix} play`
  Zajrzyj na naszą **[stronkę](%{website})** albo użyj `%{prefix} help`, by zobaczyć więcej poleceń~ >w<
about_desc3: |
  **Uwaga, przyjacielu~!**
  Najlepiej dać mi uprawnienia `Administrator`, ale...
  Nawet bez nich potrafię działać! Po prostu nie wszystko może mi się udać~ Uprzedzam! >_<

  **Pomoc i wsparcie**
  Dołącz na nasz **[serwerek pomocy](%{serversupport})**, jeśli potrzebujesz wsparcia, wieści o aktualizacjach i problemach albo chcesz pogadać ze społecznością! Nyaa~ <3

