## Helper setup ##
setup_helper_content: |
  ## Witaj na %{guild}
   *Jesteś nowy? To idealne miejsce dla ciebie~*
   > **Twoja muzyczka, gdziekolwiek grasz~ Słuchaj ze znajomymi na kanałach głosowych, uruchom Aktywność Discorda albo odtwarzacz internetowy.** UwU
   Ten serwerek to dom społeczności %{guild}~
   Możesz rozmawiać, dzielić się piosienkami, szukać wsparcia i odkrywać możliwości %{bot}, nya~
  ### Szybka nawigacja
   - Zgłoś błędzik: https://discord.com/channels/
   - Zaproponuj zmianę: https://discord.com/channels/
   - Utwórz zgłoszenie: https://discord.com/channels/
   - Otwórz centrum pomocy (FAQ): https://discord.com/channels/
  ### Porady społeczności
   - Szanuj innych i zachowuj przyjazny ton~
   - Pisz na odpowiednich kanałach.
   - Potrzebujesz pomocy? Podaj szczegóły, by zespół mógł szybciej pomóc, plosię~
  Chcesz zaprosić znajomych? Udostępnij link: %{serversupport} <3

