## RULES Events ##
rules_title: "Zasady społeczności serwerka %{guild}!"
rules_desc: |
  - **Szanuj innych**
    Zawsze przestrzegaj [regulaminu](https://discord.com/terms) i [wytycznych](https://discord.com/guidelines) Discorda, nya~
  - **Pomoc z kodem**
    Gdy prosisz o pomoc, podaj jak najwięcej szczegółów, w tym komunikaty błędów, plosię~
  - **Zakaz mowy nienawiści i nękania**
    Nie wolno nękać osób ani grup ani kierować wobec nich mowy nienawiści.
  - **Zakaz trollowania i prowokowania kłótni**
    Nie zakłócaj rozmów ani nie prowokuj celowo konfliktów.
  - **Szanuj własność intelektualną**
    Przestrzegaj praw autorskich, praw do znaków towarowych i patentów.
  - **Nie zdradzaj fabuły bez ostrzeżenia**
    Oznaczaj spoilery, żeby nie zepsuć innym zabawy, plosię~
  - **Korzystaj z właściwych kanałów**
    Dobieraj kanały do tematów i nie rób offtopu tam, gdzie nie pasuje.
  - **Nie nadużywaj wielkich liter ani spamu**
    Unikaj pisania wszystkiego WIELKIMI LITERAMI i zasypywania czatu wiadomościami, nya~
  - **Dbaj o spokój na głosowych**
    Unikaj przeszkadzającego hałasu i rozmawiaj uprzejmie~
  - **Bez nieautoryzowanych botów i automatyzacji**
    Na serwerku mogą działać tylko boty zatwierdzone przez moderację.
  - **Zgłaszaj naruszenia**
    Zauważone naruszenia zgłaszaj moderatorom lub administracji, plosię~
  - **Baw się dobrze!**
    Najważniejsze, by szanować innych i dbać o pozytywną atmosferkę, nya~ <3

  Dzięki za dołączenie! Życzymy wspaniałej zabawy, UwU~

