### privacy policy commands
privacy_title: "Polityka prywatności %{bot}"
privacy_label: Polityka prywatności
privacy_desc: |
  **Zgoda użytkownika**
  Korzystanie z [%{bot}](%{serversupport}) („bot”) na serwerku wymaga zbierania określonych danych użytkowników, nya~ Są to między innymi identyfikator Discord, nazwa użytkownika Discord oraz role na serwerku. Korzystanie z bota oznacza akceptację warunków niniejszej polityki.

  **Dostęp do danych**
  Dostęp do danych mają wyłącznie twórcy bota i dostawcy hostingu, tylko w zakresie niezbędnym do rozwoju, testowania i wdrażania funkcji. Dane nie są sprzedawane, przekazywane ani udostępniane osobom trzecim, chyba że wymagają tego przepisy prawa lub warunki korzystania z usług. Możesz uzyskać wgląd do swoich danych, zwracając się do [twórcy](%{developer}).

  **Przechowywanie danych**
  Dane przechowywane są w bazie [PostgreSQL](https://www.postgresql.org/). Baza jest zabezpieczona przed dostępem z zewnątrz. Nie da się jednak zagwarantować pełnego bezpieczeństwa; właściciel bota nie ponosi odpowiedzialności za nieumyślne lub złośliwe naruszenia ochrony danych. W przypadku nieuprawnionego dostępu do danych zespół poinformuje użytkowników za pośrednictwem serwerka pomocy.

  **Prawa użytkownika**
  W każdej chwili możesz poprosić o dostęp do danych swojego konta Discord. Masz także prawo zażądać usunięcia odpowiednich danych. W tym celu prześlij zgłoszenie przez serwerek pomocy, plosię~

  **Pytania**
  Jeśli masz pytania lub wątpliwości dotyczące przechowywanych danych, skontaktuj się z [obsługą](%{serversupport}). Więcej informacji znajdziesz w regulaminie Discorda, nya~

