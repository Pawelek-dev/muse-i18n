### terms of services commands
termsofservice_title: "Warunki korzystania z %{bot}"
tos_label: "Warunki korzystania z usługi"
termsofservice_desc: |
  **Umowa dotycząca korzystania**
  Zapraszając [%{bot}](%{serversupport}) („bot”) i używając jego funkcji, akceptujesz warunki korzystania z bota i jego politykę prywatności.

  Przyjmujesz do wiadomości, że możesz swobodnie korzystać z bota na dowolnym serwerku Discord, którego jesteś członkiem. Możesz zaprosić go na serwerek, na którym masz uprawnienie „Zarządzanie serwerkiem”. Prawo to może zostać cofnięte w przypadku naruszenia warunków korzystania z bota, jego polityki prywatności albo regulaminu, polityki prywatności bądź wytycznych społeczności Discord Inc.

  Zapraszając bota, zgadzasz się, że może on zbierać określone dane opisane w polityce prywatności. Dane te są wykorzystywane do podstawowych funkcji bota, takich jak wykonywanie komend.

  **Powiązania**
  Bot nie jest powiązany z Discord Inc., nie jest przez tę firmę wspierany ani tworzony. Wszelkie bezpośrednie podobieństwa do Discorda lub jego znaków towarowych są przypadkowe. Nie rościmy sobie praw do zasobów Discorda, jego znaków towarowych ani innej własności intelektualnej.

  **Użytkownicy niepełnoletni**
  Z bota nie mogą korzystać osoby poniżej 13. roku życia ani osoby poniżej wieku wymaganego prawem do wyrażenia zgody w ich kraju. Jest to zgodne z regulaminem Discorda. Nie gromadzimy świadomie danych osób poniżej wymaganego wieku. Jeśli wykryjemy taki przypadek, podejmiemy niezbędne działania w celu usunięcia zgromadzonych danych.

  **Odpowiedzialność**
  Twórcy i właściciel bota nie ponoszą odpowiedzialności za osoby naruszające niniejsze warunki. Zastrzegamy sobie prawo do ich aktualizacji, z tygodniowym (7 dni) okresem na rezygnację z nowych warunków. Użytkownik może zrezygnować, usuwając bota z każdego serwerka, na którym ma do tego uprawnienia.
