eq_author: Korektor
eq_icon: 
  https://i.pinimg.com/originals/cb/17/b8/cb17b80a942d7c317a35ff1324fae12f.gif
eq_desc: |
  Jest **10 "suwaków"** których pozycję można ustawić w zakresie od **-10** do **10**
  Nie musisz wpisywać wszystkich, tylko te które chcesz "przesunąć".
  Jeśli więc nie chcesz dokonać zmiany, możesz pozostawić wartość jako **0**
eq_field_title: 'Przykład:'
eq_field_value: '%{prefix}eq 2 3 0 8 0 5 0 -5 0 0'
