about_desc1: '**Twoja muzyka, gdziekolwiek zechcesz. Słuchaj z przyjaciółmi na kanałach
  głosowych, użyj Aktywności, lub rozkoszuj się muzyką z odtwarzacza internetowego.**'
about_desc2: |
  ・Prefiks bota dla tego serwera to `%{prefix}`
  ・Odtwórz utwór na podstawie linku lub hasła wyszukiwania: `%{prefix} play`
  Odwiedź naszą **[stronę internetową](%{website})** lub skorzystaj z polecenia `%{prefix} help`, aby zapoznać się z innymi poleceniami.
about_desc3: |
  **Uwaga!**
  Najlepiej byłoby, gdybym miał uprawnienia `Administratora`, ale…
  Nawet jeśli nie przyznasz mi tych uprawnień, nadal będę mógł pracować, ale może nie uda mi się zrobić wszystkiego, do czego jestem zdolny. Tak tylko mówię!

  **Pomoc i wsparcie**
  Dołącz do naszego **[serwera wsparcia](%{serversupport})**, jeśli potrzebujesz pomocy, chcesz uzyskać informacje o aktualizacjach i problemach lub chcesz nawiązać kontakt ze społecznością!
